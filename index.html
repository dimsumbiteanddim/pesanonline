<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KASIR POS - BITE & DIM</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
    h1 { color: #333; }
    .container { display: flex; gap: 20px; }
    .menu-section, .cart-section { background: #fff; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .menu-section { flex: 2; }
    .cart-section { flex: 1; }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin-top: 10px; }
    .menu-card { border: 1px solid #ddd; padding: 10px; border-radius: 5px; text-align: center; background: #fafafa; }
    .menu-card button { background: #28a745; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin-top: 5px; }
    .menu-card button:disabled { background: #ccc; cursor: not-allowed; }
    .cart-item { display: flex; justify-content: space-between; margin-bottom: 8px; border-bottom: 1px dashed #ccc; padding-bottom: 5px; }
    .btn-pay { background: #007bff; color: white; border: none; width: 100%; padding: 10px; font-size: 16px; border-radius: 5px; cursor: pointer; margin-top: 15px; }
  </style>
</head>
<body>

  <h1>KASIR POS - BITE & DIM</h1>

  <div class="container">
    <!-- SEKSI MENU -->
    <div class="menu-section">
      <h3>Daftar Menu</h3>
      <div id="loading">Memuat menu dari Google Sheets...</div>
      <div class="menu-grid" id="menuGrid"></div>
    </div>

    <!-- SEKSI KERANJANG -->
    <div class="cart-section">
      <h3>Keranjang</h3>
      <div id="cartItems">Belum ada menu dipilih.</div>
      <hr>
      <p><strong>Total: Rp <span id="totalHarga">0</span></strong></p>
      <button class="btn-pay" onclick="prosesBayar()">Proses Bayar</button>
    </div>
  </div>

  <script>
    // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT KAMU
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxijavfFwCPC4BrH2-hYpZIN2tJuhfN4hmLo9eGRxKCkVnPGZXPF8CtXIqrzsNGUtOqmA/exec"; 

    let keranjang = [];

    // FUNGSI MEMUAT MENU DARI GOOGLE SHEETS
    function loadMenu() {
      fetch(SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
          document.getElementById("loading").style.display = "none";
          const grid = document.getElementById("menuGrid");
          grid.innerHTML = "";

          if (data.status === "success" && data.menu) {
            data.menu.forEach(item => {
              const card = document.createElement("div");
              card.className = "menu-card";
              card.innerHTML = `
                <h4>${item.produk}</h4>
                <p>Rp ${item.harga.toLocaleString("id-ID")}</p>
                <p><small>Stok: ${item.stok} porsi</small></p>
                <button onclick="tambahKeranjang('${item.produk}', ${item.harga})" ${item.stok <= 0 ? 'disabled' : ''}>
                  ${item.stok <= 0 ? 'Habis' : 'Tambah'}
                </button>
              `;
              grid.appendChild(card);
            });
          }
        })
        .catch(err => {
          document.getElementById("loading").innerText = "Gagal memuat menu.";
          console.error(err);
        });
    }

    // FUNGSI TAMBAH KE KERANJANG
    function tambahKeranjang(nama, harga) {
      const ada = keranjang.find(i => i.produk === nama);
      if (ada) {
        ada.qty += 1;
        ada.subtotal = ada.qty * harga;
      } else {
        keranjang.push({ produk: nama, harga: harga, qty: 1, subtotal: harga });
      }
      renderKeranjang();
    }

    // RENDER KERANJANG
    function renderKeranjang() {
      const container = document.getElementById("cartItems");
      if (keranjang.length === 0) {
        container.innerHTML = "Belum ada menu dipilih.";
        document.getElementById("totalHarga").innerText = "0";
        return;
      }

      container.innerHTML = "";
      let total = 0;

      keranjang.forEach(item => {
        total += item.subtotal;
        container.innerHTML += `
          <div class="cart-item">
            <span>${item.produk} x${item.qty}</span>
            <span>Rp ${item.subtotal.toLocaleString("id-ID")}</span>
          </div>
        `;
      });

      document.getElementById("totalHarga").innerText = total.toLocaleString("id-ID");
    }

    // PROSES BAYAR / SIMPAN TRANSAKSI
    function prosesBayar() {
      if (keranjang.length === 0) return alert("Keranjang masih kosong!");

      const payload = {
        namaPelanggan: "Pelanggan Kasir",
        items: keranjang,
        discount: 0
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          alert("Transaksi Berhasil!");
          keranjang = [];
          renderKeranjang();
          loadMenu(); // Refresh stok
        }
      })
      .catch(err => alert("Gagal memproses transaksi."));
    }

    // JALANKAN SAAT HALAMAN DIBUKA
    document.addEventListener("DOMContentLoaded", loadMenu);
  </script>
</body>
</html>
