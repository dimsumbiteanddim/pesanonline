<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bite & Dim App</title>

  <!-- Firebase Compatibility SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-messaging-compat.js"></script>
</head>
<body>

  <h1>Bite & Dim App</h1>

  <!-- Form Login & Register -->
  <div id="auth-box">
    <h3>Login / Registrasi</h3>
    <input type="email" id="email" placeholder="Email" style="display:block; margin-bottom:10px;">
    <input type="password" id="password" placeholder="Password" style="display:block; margin-bottom:10px;">
    <button onclick="doRegister()">Daftar Account Baru</button>
    <button onclick="doLogin()">Login</button>
  </div>

  <!-- Tampilan Setelah Login -->
  <div id="app-box" style="display:none;">
    <h3>Selamat Datang, <span id="user-display"></span>!</h3>
    <button onclick="enableNotifications()">Aktifkan Notifikasi Pesanan 🔔</button>
    <button onclick="doLogout()">Logout</button>
  </div>

  <script>
    // ⚙️ 1. Ganti variabel di bawah ini sesuai dengan Project Firebase kamu
    const firebaseConfig = {
      apiKey: "API_KEY_KAMU",
      authDomain: "biteanddim-31ebb.firebaseapp.com",
      projectId: "biteanddim-31ebb",
      storageBucket: "biteanddim-31ebb.appspot.com",
      messagingSenderId: "MESSAGING_SENDER_ID_KAMU",
      appId: "APP_ID_KAMU"
    };

    // 🔑 2. Isikan VAPID Key dari Firebase Console & URL Deployment Web App Apps Script kamu
    const VAPID_KEY = "BJzmDkwdRz_rFKXuLsqSiUOReCaUm_HyPUO6Ie7TbpOxBFlBt1pxO-dG3JmT9bMf8v9SCXUb6bTZ2Y1w-Uin-lc";
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxijavfFwCPC4BrH2-hYpZIN2tJuhfN4hmLo9eGRxKCkVnPGZXPF8CtXIqrzsNGUtOqmA/exec";

    // Inisialisasi Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const messaging = firebase.messaging();

    // Pantau Status Login User (Auto switch tampilan UI)
    auth.onAuthStateChanged((user) => {
      if (user) {
        document.getElementById('auth-box').style.display = 'none';
        document.getElementById('app-box').style.display = 'block';
        document.getElementById('user-display').innerText = user.email;
      } else {
        document.getElementById('auth-box').style.display = 'block';
        document.getElementById('app-box').style.display = 'none';
      }
    });

    // Register User
    function doRegister() {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      auth.createUserWithEmailAndPassword(e, p)
        .then(() => alert("Registrasi Berhasil!"))
        .catch(err => alert("Gagal Register: " + err.message));
    }

    // Login User
    function doLogin() {
      const e = document.getElementById('email').value;
      const p = document.getElementById('password').value;
      auth.signInWithEmailAndPassword(e, p)
        .then(() => alert("Login Berhasil!"))
        .catch(err => alert("Gagal Login: " + err.message));
    }

    // Logout User
    function doLogout() {
      auth.signOut();
    }

    // Minta Izin Notifikasi & Ambil FCM Token
    function enableNotifications() {
      Notification.requestPermission().then((permission) => {
        if (permission === 'granted') {
          messaging.getToken({ vapidKey: VAPID_KEY }).then((token) => {
            if (token) {
              saveTokenToBackend(auth.currentUser.email, token);
            } else {
              alert("Gagal mendapatkan FCM Token.");
            }
          }).catch(err => alert("Error Token: " + err.message));
        } else {
          alert('Izin notifikasi ditolak!');
        }
      });
    }

    // Kirim Email & Token Notifikasi ke Google Sheets via Apps Script
    function saveTokenToBackend(email, token) {
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          action: "register_user",
          email: email,
          fcmToken: token
        })
      })
      .then(res => res.json())
      .then(data => alert("Notifikasi berhasil diaktifkan dan terhubung!"))
      .catch(err => console.error("Error Apps Script:", err));
    }
  </script>
</body>
</html>
